<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiGyt's Fractal Explorer</title>
<style>
  :root {
    --bg: #0a0b10;
    --panel: #11131a;
    --panel-2: #171a23;
    --line: #2a2e3a;
    --text: #f2f4f8;
    --muted: #9ca4b4;
    --accent: #8bd3ff;
    --accent-2: #c7a8ff;
    --danger: #ff8d8d;
    --shadow: 0 22px 60px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 0%, rgba(139,211,255,.09), transparent 35%),
      radial-gradient(circle at 85% 100%, rgba(199,168,255,.08), transparent 30%),
      var(--bg);
    font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .app {
    width: 100%;
    min-width: 0;
    height: 100vh;
    min-height: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 10px 16px 8px;
  }

  h1 {
    font-size: clamp(22px, 2.2vw, 32px);
    line-height: 1;
    margin: 0 0 5px;
    letter-spacing: -.03em;
  }

  .shell {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    width: 100%;
    min-height: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
    overflow: hidden;
    box-shadow: none;
    backdrop-filter: none;
  }

  .sidebar {
    width: 100%;
    padding: 0 12px 6px;
    border: 0;
    background: transparent;
    overflow: visible;
  }

  .section {
    padding: 0;
    margin: 0;
    border: 0;
  }

  .dashboard {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 0 0 2px;
    overflow: visible;
  }

  /* ============================================================
     Dashboard rows
     ============================================================ */

  .dashboard-row {
    width: 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /*
    TOP ROW:
    The whole row is one horizontal scroller.

    Each section keeps its natural width:
      Family | Examples | Visualization

    Nothing inside the row is allowed to shrink away.
  */
  .dashboard-row.top-row {
    overflow-x: auto;
    overflow-y: hidden;
    flex-wrap: nowrap;
    justify-content: flex-start;
    scrollbar-width: thin;
    scrollbar-color: #343948 transparent;
    -webkit-overflow-scrolling: touch;
  }

  .dashboard-row.top-row::-webkit-scrollbar {
    height: 5px;
  }

  .dashboard-row.top-row::-webkit-scrollbar-track {
    background: transparent;
  }

  .dashboard-row.top-row::-webkit-scrollbar-thumb {
    background: #343948;
    border-radius: 99px;
  }

  .dashboard-row.top-row > .section {
    flex: 0 0 auto;
    min-width: max-content;
  }

  /*
    Parameters row keeps the original behavior.
  */
  .dashboard-row:not(.top-row) {
    overflow: visible;
  }

  .dashboard-row > .section {
    min-width: 0;
  }

  /* ============================================================
     Top-row sections
     ============================================================ */

  .family-section {
    flex: 0 0 auto;
    width: max-content;
  }

  .examples-section {
    flex: 0 0 auto;
    width: max-content;
    min-width: max-content;
    overflow: visible;
  }

  .visualization-section {
    flex: 0 0 auto;
    width: max-content;
    margin-left: 0;
  }

  /*
    The controls themselves should size to their contents rather
    than becoming separate horizontal scroll areas.
  */
  .family-section .compact-bar,
  .examples-section .compact-bar {
    width: max-content;
  }

  .examples-section .compact-bar {
    justify-content: flex-start;
  }

  .visual-controls {
    width: max-content;
  }

  /* ============================================================
     Parameters
     ============================================================ */

  .parameters-section {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
  }

  .section-title {
    display: inline-block;
    margin: 0 8px 0 0;
    color: #d7dce7;
    text-transform: uppercase;
    letter-spacing: .09em;
    font-size: 10px;
    font-weight: 700;
    vertical-align: middle;
    white-space: nowrap;
  }

  .compact-bar {
    min-width: 0;
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 7px;
    overflow-x: hidden;
    overflow-y: hidden;
    white-space: nowrap;
    padding-bottom: 1px;
  }

  button, input, select {
    font: inherit;
  }

  button {
    flex: 0 0 auto;
    color: var(--text);
    background: rgba(23,26,35,.92);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
    transition: .16s ease;
    white-space: nowrap;
  }

  button:hover {
    transform: translateY(-1px);
    border-color: #465066;
  }

  button.active {
    background: linear-gradient(135deg, rgba(139,211,255,.16), rgba(199,168,255,.12));
    border-color: #6688a4;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  }

  .parameter-bar {
    width: 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 1px;
    scrollbar-width: thin;
    white-space: nowrap;
  }

  .parameter-bar::-webkit-scrollbar {
    height: 5px;
  }

  .parameter-bar::-webkit-scrollbar-track {
    background: transparent;
  }

  .parameter-bar::-webkit-scrollbar-thumb {
    background: #343948;
    border-radius: 99px;
  }

  .field {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 5px;
    width: auto;
  }

  .field.full {
    grid-column: auto;
  }

  label {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }

  input, select {
    width: 72px;
    min-width: 72px;
    max-width: 72px;
    height: 32px;
    color: var(--text);
    background: rgba(12,14,20,.96);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    outline: none;
  }

  input:focus, select:focus {
    border-color: #5d7e99;
  }

  .expression-field input {
    width: 250px;
    min-width: 250px;
    max-width: 250px;
  }

  .compact-field input {
    width: 72px;
    min-width: 72px;
    max-width: 72px;
  }

  .help {
    display: none;
  }

  .visual-controls {
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: visible;
    white-space: nowrap;
    padding-bottom: 1px;
  }

  .toggle-row {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    background: rgba(12,14,20,.92);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 7px;
  }

  .visual-controls .field {
    flex: 0 0 auto;
  }

  .switch {
    position: relative;
    width: 34px;
    height: 19px;
    flex: 0 0 auto;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    inset: 0;
    border-radius: 99px;
    background: #2a2e3a;
    cursor: pointer;
    transition: .2s ease;
  }

  .slider:before {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: #dfe4ec;
    transition: .2s ease;
  }

  .switch input:checked + .slider {
    background: #607f99;
  }

  .switch input:checked + .slider:before {
    transform: translateX(15px);
  }

  /* ============================================================
     Stage
     ============================================================ */

  .stage {
    position: relative;
    flex: 1 1 0;
    width: 100%;
    min-width: 0;
    min-height: 0;
    height: auto;
    background: #000;
    border-top: 1px solid rgba(255,255,255,.05);
    overflow: hidden;
  }

  .canvas-wrap {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 10px;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: none;
    max-height: none;
    image-rendering: auto;
    background: #000;
    border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 12px 40px rgba(0,0,0,.45);
  }

  .plot-overlay {
    position: absolute;
    pointer-events: none;
    z-index: 3;
  }

  .save-button {
    position: absolute;
    left: 16px;
    top: 14px;
    margin: 0;
    pointer-events: auto;
  }

  .watermark {
    position: absolute;
    right: 16px;
    top: 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    color: #9da5b3;
    font: 10px system-ui, sans-serif;
    line-height: 1.15;
    text-align: right;
    white-space: nowrap;
    pointer-events: auto;
  }

  .watermark-name {
    font-weight: 400;
  }

  .watermark a {
    color: #9da5b3;
    font: inherit;
    text-decoration: none;
  }

  .watermark a:hover {
    color: #9da5b3;
    text-decoration: underline;
  }

  .pill {
    padding: 6px 9px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(8,10,14,.62);
    color: #dce2ea;
    backdrop-filter: blur(8px);
    font-size: 10px;
  }

  .status {
    position: absolute;
    left: 16px;
    bottom: 14px;
    right: 16px;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    color: #9da5b3;
    font-size: 10px;
  }

  .progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: transparent;
  }

  .progress > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8bd3ff, #c7a8ff);
    transition: width .05s linear;
  }

  .hidden {
    display: none !important;
  }

  /* ============================================================
     Mobile
     ============================================================ */

  @media (max-width: 760px) {
    html, body, .app {
      height: 100dvh;
      min-height: 100dvh;
    }

    .shell {
      min-height: 0;
      height: auto;
    }

    .stage {
      min-height: 0;
    }

    .status {
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 4;
    }

    .progress {
      z-index: 4;
    }

    header {
      padding: 8px 10px 6px;
    }

    h1 {
      font-size: 20px;
    }

    .sidebar {
      padding: 0 8px 5px;
    }

    .dashboard {
      gap: 4px;
    }

    /*
      Keep the top row as ONE horizontal scroll container.
      Do not give Family or Examples viewport-based widths.
    */
    .dashboard-row.top-row {
      gap: 7px;
    }

    .dashboard-row.top-row > .section {
      flex: 0 0 auto;
      width: max-content;
      min-width: max-content;
    }

    .family-section {
      max-width: none;
    }

    .examples-section {
      max-width: none;
      overflow: visible;
    }

    .visualization-section {
      margin-left: 0;
    }

    .section-title {
      min-width: 70px;
    }

    .expression-field input {
      width: 220px;
      min-width: 220px;
      max-width: 220px;
    }
  }

  @media (max-width: 430px) {
    h1 {
      font-size: 19px;
    }

    button {
      padding: 6px 8px;
      font-size: 12px;
    }

    input, select {
      height: 29px;
      min-width: 68px;
      width: 68px;
      max-width: 68px;
      font-size: 12px;
    }

    .expression-field input {
      width: 190px;
      min-width: 190px;
      max-width: 190px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>
        <a href="https://digyt.github.io/">DiGyt's</a> Fractal Explorer
      </h1>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="dashboard">

        <!-- ======================================================
             TOP ROW: ONE HORIZONTAL SCROLLER
             Family | Examples | Visualization
             ====================================================== -->
        <div class="dashboard-row top-row">

          <section class="section family-section">
            <h2 class="section-title">Family</h2>
            <div class="family-buttons compact-bar" id="familyButtons">
              <button data-family="mandelbrot">Mandelbrot-like</button>
              <button data-family="newton">Newton-like</button>
              <button data-family="lyapunov">Lyapunov-like</button>
            </div>
          </section>

          <section class="section examples-section">
            <h2 class="section-title">Examples</h2>
            <div class="example-buttons compact-bar" id="examples"></div>
          </section>

          <section class="section visualization-section">
            <h2 class="section-title">Visualization</h2>
            <div class="visual-controls">
              <div class="toggle-row">
                <label for="showAxis">Show axis</label>
                <label class="switch">
                  <input id="showAxis" type="checkbox">
                  <span class="slider"></span>
                </label>
              </div>

              <div class="field">
                <label for="colormap">Color map</label>
                <select id="colormap">
                  <option value="magma" selected>magma</option>
                  <option value="viridis">viridis</option>
                  <option value="plasma">plasma</option>
                  <option value="inferno">inferno</option>
                  <option value="turbo">turbo</option>
                  <option value="gray">gray</option>
                </select>
              </div>
            </div>
          </section>

        </div>

        <!-- ======================================================
             PARAMETERS ROW
             ====================================================== -->
        <div class="dashboard-row">
          <section class="section parameters-section">
            <h2 class="section-title">Parameters</h2>
            <div id="parameters"></div>
          </section>
        </div>

      </div>
    </aside>

    <main class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>

      <div class="plot-overlay" id="plotOverlay" aria-hidden="false">
        <button class="pill save-button" id="savePng" type="button">Save as .png</button>
        <div class="watermark">
          <a
            href="https://digyt.github.io/fractal_explorer/"
            target="_blank"
            rel="noopener noreferrer"
          >digyt.github.io/fractal_explorer</a>
        </div>
      </div>

      <div class="status">
        <span id="statusText">Ready</span>
        <span id="coordsText">Re: —  Im: —</span>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>
    </main>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   Complex arithmetic
   ============================================================ */

function complex(re, im = 0) {
  return { re, im };
}

function cAdd(a, b) {
  return { re: a.re + b.re, im: a.im + b.im };
}

function cSub(a, b) {
  return { re: a.re - b.re, im: a.im - b.im };
}

function cMul(a, b) {
  return {
    re: a.re * b.re - a.im * b.im,
    im: a.re * b.im + a.im * b.re
  };
}

function cDiv(a, b) {
  const d = b.re * b.re + b.im * b.im;
  return {
    re: (a.re * b.re + a.im * b.im) / d,
    im: (a.im * b.re - a.re * b.im) / d
  };
}

function cAbs(a) {
  return Math.hypot(a.re, a.im);
}

function cAbs2(a) {
  return a.re * a.re + a.im * a.im;
}

function cPow(a, n) {
  if (Number.isInteger(n) && n >= 0) {
    let r = complex(1, 0);
    let b = a;
    let k = n;

    while (k > 0) {
      if (k & 1) r = cMul(r, b);
      b = cMul(b, b);
      k >>= 1;
    }

    return r;
  }

  const r = Math.hypot(a.re, a.im);
  const theta = Math.atan2(a.im, a.re);
  const rn = Math.pow(r, n);

  return complex(
    rn * Math.cos(n * theta),
    rn * Math.sin(n * theta)
  );
}

function cConj(a) {
  return { re: a.re, im: -a.im };
}

function cNeg(a) {
  return { re: -a.re, im: -a.im };
}

function cExp(a) {
  const e = Math.exp(a.re);

  return {
    re: e * Math.cos(a.im),
    im: e * Math.sin(a.im)
  };
}

function cLog(a) {
  return {
    re: Math.log(cAbs(a)),
    im: Math.atan2(a.im, a.re)
  };
}

function cSin(a) {
  return {
    re: Math.sin(a.re) * Math.cosh(a.im),
    im: Math.cos(a.re) * Math.sinh(a.im)
  };
}

function cCos(a) {
  return {
    re: Math.cos(a.re) * Math.cosh(a.im),
    im: -Math.sin(a.re) * Math.sinh(a.im)
  };
}

function cTan(a) {
  return cDiv(cSin(a), cCos(a));
}

function scalarToComplex(x) {
  return complex(Number(x) || 0, 0);
}

/* ============================================================
   User formula compiler
   ============================================================ */

function tokenizeExpression(source) {
  const s = String(source).trim()
    .replace(/\s+/g, "")
    .replace(/π/g, "pi")
    .replace(/\^/g, "**");

  const tokens = [];
  let i = 0;

  while (i < s.length) {
    const ch = s[i];

    if (/[0-9.]/.test(ch)) {
      let j = i + 1;

      while (j < s.length && /[0-9.]/.test(s[j])) {
        j++;
      }

      if (j < s.length && /[eE]/.test(s[j])) {
        j++;

        if (/[+-]/.test(s[j] || "")) {
          j++;
        }

        while (j < s.length && /[0-9]/.test(s[j])) {
          j++;
        }
      }

      tokens.push({
        type: "number",
        value: Number(s.slice(i, j))
      });

      i = j;
      continue;
    }

    if (/[A-Za-z_]/.test(ch)) {
      let j = i + 1;

      while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) {
        j++;
      }

      tokens.push({
        type: "identifier",
        value: s.slice(i, j)
      });

      i = j;
      continue;
    }

    if (s.startsWith("**", i)) {
      tokens.push({
        type: "operator",
        value: "**"
      });

      i += 2;
      continue;
    }

    if ("+-*/(),".includes(ch)) {
      tokens.push({
        type:
          ch === "(" || ch === ")" || ch === ","
            ? "punctuation"
            : "operator",
        value: ch
      });

      i++;
      continue;
    }

    throw new Error(`Unsupported character in formula: ${ch}`);
  }

  tokens.push({
    type: "eof",
    value: ""
  });

  return tokens;
}

function compileComplexExpression(source, variables) {
  const tokens = tokenizeExpression(source);
  let pos = 0;

  const variableSet = new Set(variables);

  function peek(value) {
    return tokens[pos].value === value;
  }

  function consume(value) {
    if (!peek(value)) {
      throw new Error(`Expected "${value}" in formula.`);
    }

    pos++;
  }

  function parseExpression() {
    return parseAddSub();
  }

  function parseAddSub() {
    let node = parseMulDiv();

    while (peek("+") || peek("-")) {
      const op = tokens[pos++].value;

      node = {
        type: "binary",
        op,
        left: node,
        right: parseMulDiv()
      };
    }

    return node;
  }

  function parseMulDiv() {
    let node = parsePower();

    while (peek("*") || peek("/")) {
      const op = tokens[pos++].value;

      node = {
        type: "binary",
        op,
        left: node,
        right: parsePower()
      };
    }

    return node;
  }

  function parsePower() {
    let node = parseUnary();

    if (peek("**")) {
      pos++;

      node = {
        type: "binary",
        op: "**",
        left: node,
        right: parsePower()
      };
    }

    return node;
  }

  function parseUnary() {
    if (peek("+")) {
      pos++;

      return {
        type: "unary",
        op: "+",
        value: parseUnary()
      };
    }

    if (peek("-")) {
      pos++;

      return {
        type: "unary",
        op: "-",
        value: parseUnary()
      };
    }

    return parsePrimary();
  }

  function parsePrimary() {
    const token = tokens[pos];

    if (token.type === "number") {
      pos++;

      return {
        type: "number",
        value: complex(token.value, 0)
      };
    }

    if (token.type === "identifier") {
      pos++;

      if (peek("(")) {
        pos++;

        const args = [];

        if (!peek(")")) {
          args.push(parseExpression());

          while (peek(",")) {
            pos++;
            args.push(parseExpression());
          }
        }

        consume(")");

        return {
          type: "function",
          name: token.value.toLowerCase(),
          args
        };
      }

      const identifier = token.value.toLowerCase();

      if (identifier === "pi") {
        return {
          type: "number",
          value: complex(Math.PI, 0)
        };
      }

      if (identifier === "i") {
        return {
          type: "number",
          value: complex(0, 1)
        };
      }

      if (variableSet.has(token.value)) {
        return {
          type: "variable",
          name: token.value
        };
      }

      throw new Error(`Unknown identifier "${token.value}".`);
    }

    if (peek("(")) {
      pos++;

      const node = parseExpression();

      consume(")");

      return node;
    }

    throw new Error("Unexpected token in formula.");
  }

  const ast = parseExpression();

  if (tokens[pos].type !== "eof") {
    throw new Error(
      `Unexpected token "${tokens[pos].value}" in formula.`
    );
  }

  function evaluate(node, env) {
    switch (node.type) {
      case "number":
        return node.value;

      case "variable":
        return env[node.name];

      case "unary": {
        const a = evaluate(node.value, env);
        return node.op === "-" ? cNeg(a) : a;
      }

      case "binary": {
        const a = evaluate(node.left, env);
        const b = evaluate(node.right, env);

        switch (node.op) {
          case "+":
            return cAdd(a, b);

          case "-":
            return cSub(a, b);

          case "*":
            return cMul(a, b);

          case "/":
            return cDiv(a, b);

          case "**": {
            if (
              Math.abs(b.im) < 1e-14 &&
              Number.isInteger(b.re)
            ) {
              return cPow(a, b.re);
            }

            return cPow(a, b.re);
          }
        }

        throw new Error(`Unknown operator "${node.op}".`);
      }

      case "function": {
        const args = node.args.map(arg => evaluate(arg, env));
        const a = args[0];

        switch (node.name) {
          case "c":
            if (args.length !== 2) {
              throw new Error("C(re, im) expects two arguments.");
            }
            return complex(args[0].re, args[1].re);

          case "conj":
          case "conjugate":
            return cConj(a);

          case "neg":
            return cNeg(a);

          case "abs":
            return complex(cAbs(a), 0);

          case "real":
            return complex(a.re, 0);

          case "imag":
            return complex(a.im, 0);

          case "exp":
            return cExp(a);

          case "log":
            return cLog(a);

          case "sin":
            return cSin(a);

          case "cos":
            return cCos(a);

          case "tan":
            return cTan(a);

          default:
            throw new Error(
              `Unknown complex function "${node.name}".`
            );
        }
      }
    }

    throw new Error("Invalid expression.");
  }

  const evaluator = env => asComplex(evaluate(ast, env));

  if (variables.length === 1) {
    return z =>
      evaluator({
        [variables[0]]: asComplex(z)
      });
  }

  return (...args) => {
    const env = {};

    variables.forEach((name, i) => {
      env[name] = asComplex(args[i]);
    });

    return evaluator(env);
  };
}

function asComplex(value) {
  if (typeof value === "number") {
    return complex(value, 0);
  }

  if (
    value &&
    typeof value.re === "number" &&
    typeof value.im === "number"
  ) {
    return value;
  }

  throw new Error(
    "Formula did not return a number or complex value."
  );
}

/* ============================================================
   Fractal algorithms
   ============================================================ */

function fractal_mandelbrot(
  functionFn = (z, c) => cAdd(cMul(z, z), c),
  x_space = null,
  z0 = 0,
  resolution = 800,
  max_iter = 100,
  return_x_space = false,
) {
  if (x_space === null) {
    const x = linspace(-2.0, 1.0, resolution);
    const y = linspace(-1.5, 1.5, resolution);

    x_space = makeXSpace(x, y);
  }

  const C = x_space;
  const n = C.re.length;

  const Zre = new Float64Array(n);
  const Zim = new Float64Array(n);
  const iterations = new Int32Array(n);

  const z0c = asComplex(z0);

  Zre.fill(z0c.re);
  Zim.fill(z0c.im);

  const kernel = functionFn._vectorKernel;

  if (kernel) {
    kernel(
      C,
      Zre,
      Zim,
      iterations,
      max_iter
    );
  } else {
    for (let i = 0; i < max_iter; i++) {
      for (let p = 0; p < n; p++) {
        const zn = asComplex(
          functionFn(
            {
              re: Zre[p],
              im: Zim[p]
            },
            {
              re: C.re[p],
              im: C.im[p]
            }
          )
        );

        Zre[p] = zn.re;
        Zim[p] = zn.im;

        if (
          Zre[p] * Zre[p] +
          Zim[p] * Zim[p] > 4 &&
          iterations[p] === 0
        ) {
          iterations[p] = i;
        }
      }
    }
  }

  return return_x_space
    ? {
        map: iterations,
        x_space
      }
    : iterations;
}

/* ============================================================
   Newton fractal
   ============================================================ */

function fractal_newton(
  functionFn = z => cSub(cPow(z, 3), complex(1)),
  x_space = null,
  derivative = z => cMul(complex(3), cPow(z, 2)),
  resolution = 1000,
  max_iter = 40,
  tolerance = 1e-8,
  return_x_space = false,
) {
  if (x_space === null) {
    const x = linspace(-2.0, 2.0, resolution);
    const y = linspace(-2.0, 2.0, resolution);

    x_space = makeXSpace(x, y);
  }

  const n = x_space.re.length;
  const Zre = new Float64Array(x_space.re);
  const Zim = new Float64Array(x_space.im);

  const result = new Float64Array(n);
  result.fill(-1.0);

  const roots = [
    complex(1, 0),
    complex(
      Math.cos(2 * Math.PI / 3),
      Math.sin(2 * Math.PI / 3)
    ),
    complex(
      Math.cos(4 * Math.PI / 3),
      Math.sin(4 * Math.PI / 3)
    ),
  ];

  const fastDefault =
    functionFn._vectorKernel &&
    derivative._vectorKernel;

  if (fastDefault) {
    const active = new Uint8Array(n);
    active.fill(1);

    let activeCount = n;

    for (
      let i = 0;
      i < max_iter && activeCount > 0;
      i++
    ) {
      for (let p = 0; p < n; p++) {
        if (!active[p]) continue;

        const zr = Zre[p];
        const zi = Zim[p];

        const f =
          functionFn._vectorScalar(zr, zi);

        const df =
          derivative._vectorScalar(zr, zi);

        const df2 =
          df.re * df.re +
          df.im * df.im;

        const safe = df2 > 1e-28;

        if (safe) {
          const q =
            (f.re * df.re + f.im * df.im) /
            df2;

          const qi =
            (f.im * df.re - f.re * df.im) /
            df2;

          Zre[p] = zr - q;
          Zim[p] = zi - qi;
        }

        if (
          safe &&
          Math.hypot(f.re, f.im) < tolerance
        ) {
          const finalZ = {
            re: Zre[p],
            im: Zim[p]
          };

          let nearestRoot = 0;

          let best =
            cAbs(cSub(finalZ, roots[0]));

          for (let r = 1; r < roots.length; r++) {
            const d =
              cAbs(cSub(finalZ, roots[r]));

            if (d < best) {
              best = d;
              nearestRoot = r;
            }
          }

          result[p] =
            nearestRoot + i / max_iter;

          active[p] = 0;
          activeCount--;
        }
      }
    }
  } else {
    const active = new Uint8Array(n);
    active.fill(1);

    let activeCount = n;

    for (
      let i = 0;
      i < max_iter && activeCount > 0;
      i++
    ) {
      for (let p = 0; p < n; p++) {
        if (!active[p]) continue;

        const Za = {
          re: Zre[p],
          im: Zim[p]
        };

        const f = asComplex(functionFn(Za));
        const df = asComplex(derivative(Za));

        const df2 =
          df.re * df.re +
          df.im * df.im;

        const safe = df2 > 1e-28;

        if (safe) {
          const q =
            (f.re * df.re + f.im * df.im) /
            df2;

          const qi =
            (f.im * df.re - f.re * df.im) /
            df2;

          Zre[p] = Za.re - q;
          Zim[p] = Za.im - qi;
        }

        if (
          safe &&
          Math.hypot(f.re, f.im) < tolerance
        ) {
          const finalZ = {
            re: Zre[p],
            im: Zim[p]
          };

          let nearestRoot = 0;

          let best =
            cAbs(cSub(finalZ, roots[0]));

          for (let r = 1; r < roots.length; r++) {
            const d =
              cAbs(cSub(finalZ, roots[r]));

            if (d < best) {
              best = d;
              nearestRoot = r;
            }
          }

          result[p] =
            nearestRoot + i / max_iter;

          active[p] = 0;
          activeCount--;
        }
      }
    }
  }

  return return_x_space
    ? {
        map: result,
        x_space
      }
    : result;
}

/* ============================================================
   Lyapunov fractal
   ============================================================ */

function fractal_lyapunov(
  sequence = "AB",
  x_space = null,
  resolution = 1000,
  iterations = 800,
  transient = 100,
  return_x_space = false,
) {
  if (x_space === null) {
    const a = linspace(2.5, 4.0, resolution);
    const b = linspace(2.5, 4.0, resolution);

    x_space = makeXSpace(a, b);
  }

  const A = x_space.re;
  const B = x_space.im;
  const n = A.length;

  const X = new Float64Array(n);
  X.fill(0.5);

  const lyapunov = new Float64Array(n);

  sequence = sequence.toUpperCase();

  for (
    let i = 0;
    i < transient + iterations;
    i++
  ) {
    const useA =
      sequence[i % sequence.length] === "A";

    for (let p = 0; p < n; p++) {
      const r = useA ? A[p] : B[p];

      X[p] =
        r *
        X[p] *
        (1 - X[p]);

      if (i >= transient) {
        const derivative =
          Math.abs(
            r *
            (1 - 2 * X[p])
          );

        lyapunov[p] +=
          Math.log(
            derivative + 1e-12
          );
      }
    }
  }

  for (let p = 0; p < n; p++) {
    lyapunov[p] /= iterations;
  }

  return return_x_space
    ? {
        map: lyapunov,
        x_space
      }
    : lyapunov;
}

/* ============================================================
   Fast vector kernels
   ============================================================ */

function attachMandelbrotKernel(fn, type) {
  fn._vectorKernel = function(
    C,
    Zre,
    Zim,
    iterations,
    maxIter
  ) {
    const n = C.re.length;

    for (let i = 0; i < maxIter; i++) {
      for (let p = 0; p < n; p++) {
        const zr = Zre[p];
        const zi = Zim[p];
        const cr = C.re[p];
        const ci = C.im[p];

        let nr;
        let ni;

        if (type === "z2+c") {
          nr =
            zr * zr -
            zi * zi +
            cr;

          ni =
            2 * zr * zi +
            ci;

        } else if (type === "z4+c") {
          const ar =
            zr * zr -
            zi * zi;

          const ai =
            2 * zr * zi;

          nr =
            ar * ar -
            ai * ai +
            cr;

          ni =
            2 * ar * ai +
            ci;

        } else if (type === "conjz2+c") {
          nr =
            zr * zr -
            zi * zi +
            cr;

          ni =
            -2 * zr * zi +
            ci;
        } else {
          return;
        }

        Zre[p] = nr;
        Zim[p] = ni;

        if (
          nr * nr +
          ni * ni > 4 &&
          iterations[p] === 0
        ) {
          iterations[p] = i;
        }
      }
    }
  };

  return fn;
}

function attachNewtonKernel(
  fn,
  derivativeFn,
  type
) {
  if (type === "z3-1") {
    fn._vectorKernel = true;
    derivativeFn._vectorKernel = true;

    fn._vectorScalar = (zr, zi) => {
      const z2r =
        zr * zr -
        zi * zi;

      const z2i =
        2 * zr * zi;

      return {
        re:
          z2r * zr -
          z2i * zi -
          1,

        im:
          z2r * zi +
          z2i * zr
      };
    };

    derivativeFn._vectorScalar =
      (zr, zi) => {
        return {
          re:
            3 *
            (zr * zr -
              zi * zi),

          im:
            6 *
            zr *
            zi
        };
      };
  }
}

/* ============================================================
   Grid utilities
   ============================================================ */

function linspace(
  start,
  stop,
  count
) {
  if (count <= 1) return [start];

  const out =
    new Float64Array(count);

  const step =
    (stop - start) /
    (count - 1);

  for (let i = 0; i < count; i++) {
    out[i] =
      start +
      i * step;
  }

  return out;
}

function makeXSpace(x, y) {
  const cols = x.length;
  const rows = y.length;

  const re =
    new Float64Array(
      rows * cols
    );

  const im =
    new Float64Array(
      rows * cols
    );

  let p = 0;

  for (let iy = 0; iy < rows; iy++) {
    for (let ix = 0; ix < cols; ix++) {
      re[p] = x[ix];
      im[p] = y[iy];
      p++;
    }
  }

  return {
    re,
    im,
    rows,
    cols,
    xMin: x[0],
    xMax: x[x.length - 1],
    yMin: y[0],
    yMax: y[y.length - 1]
  };
}

];

function interpolateStops(stops, t) {
  t = Math.max(
    0,
    Math.min(1, t)
  );

  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] =
        stops[i - 1];

      const [t1, c1] =
        stops[i];

      const u =
        (t - t0) /
        (t1 - t0);

      return [
        Math.round(
          c0[0] +
          (c1[0] - c0[0]) * u
        ),
        Math.round(
          c0[1] +
          (c1[1] - c0[1]) * u
        ),
        Math.round(
          c0[2] +
          (c1[2] - c0[2]) * u
        )
      ];
    }
  }

  return stops[
    stops.length - 1
  ][1].slice();
}

function colorAt(name, t) {
  if (name === "gray") {
    const v =
      Math.round(
        255 *
        Math.max(
          0,
          Math.min(1, t)
        )
      );

    return [v, v, v];
  }

  const table = {
    viridis: VIRIDIS_STOPS,
    magma: MAGMA_STOPS,
    plasma: PLASMA_STOPS,
    inferno: INFERNO_STOPS,
    turbo: TURBO_STOPS
  }[name] || VIRIDIS_STOPS;

  return interpolateStops(
    table,
    t
  );
}

/* ============================================================
   Universal renderer
   ============================================================ */

function plot_fractal_map(
  fractal_map,
  x_space = null,
  cmap = "magma",
  show_axis = false,
) {
  const canvas =
    document.getElementById(
      "canvas"
    );

  const ctx =
    canvas.getContext(
      "2d",
      { alpha: false }
    );

  const rows =
    x_space
      ? x_space.rows
      : state.resY;

  const cols =
    x_space
      ? x_space.cols
      : state.resX;

  canvas.width = cols;
  canvas.height = rows;

  const image =
    ctx.createImageData(
      cols,
      rows
    );

  const data =
    image.data;

  let min = Infinity;
  let max = -Infinity;

  for (
    let i = 0;
    i < fractal_map.length;
    i++
  ) {
    const v =
      fractal_map[i];

    if (Number.isFinite(v)) {
      if (v < min) min = v;
      if (v > max) max = v;
    }
  }

  if (
    !Number.isFinite(min) ||
    !Number.isFinite(max) ||
    min === max
  ) {
    min = 0;
    max = 1;
  }

  for (let srcY = 0; srcY < rows; srcY++) {
    const dstY =
      rows -
      1 -
      srcY;

    for (let x = 0; x < cols; x++) {
      const p =
        srcY * cols +
        x;

      const v =
        fractal_map[p];

      let t =
        (v - min) /
        (max - min);

      if (!Number.isFinite(t)) {
        t = 0;
      }

      const [r, g, b] =
        colorAt(cmap, t);

      const q =
        (dstY * cols + x) *
        4;

      data[q] = r;
      data[q + 1] = g;
      data[q + 2] = b;
      data[q + 3] = 255;
    }
  }

  ctx.putImageData(
    image,
    0,
    0
  );

  if (
    show_axis &&
    x_space
  ) {
    drawAxes(
      ctx,
      x_space,
      cols,
      rows
    );
  }

  fitCanvasToStage();
}

function niceStep(
  range,
  targetTicks = 7
) {
  const raw =
    range /
    targetTicks;

  const power =
    Math.pow(
      10,
      Math.floor(
        Math.log10(raw)
      )
    );

  const normalized =
    raw / power;

  let factor = 1;

  if (normalized >= 5) {
    factor = 5;
  } else if (normalized >= 2) {
    factor = 2;
  }

  return factor * power;
}

function drawAxes(
  ctx,
  x_space,
  cols,
  rows
) {
  const xmin = x_space.xMin;
  const xmax = x_space.xMax;
  const ymin = x_space.yMin;
  const ymax = x_space.yMax;

  const px =
    x =>
      (x - xmin) /
      (xmax - xmin) *
      cols;

  const py =
    y =>
      rows -
      (y - ymin) /
        (ymax - ymin) *
        rows;

  ctx.save();

  ctx.lineWidth = 1;
  ctx.strokeStyle =
    "rgba(255,255,255,.40)";
  ctx.fillStyle =
    "rgba(255,255,255,.72)";
  ctx.font =
    "11px system-ui, sans-serif";

  if (
    xmin <= 0 &&
    xmax >= 0
  ) {
    const x0 = px(0);

    ctx.beginPath();
    ctx.moveTo(
      x0 + .5,
      0
    );
    ctx.lineTo(
      x0 + .5,
      rows
    );
    ctx.stroke();
  }

  if (
    ymin <= 0 &&
    ymax >= 0
  ) {
    const y0 = py(0);

    ctx.beginPath();
    ctx.moveTo(
      0,
      y0 + .5
    );
    ctx.lineTo(
      cols,
      y0 + .5
    );
    ctx.stroke();
  }

  const xStep =
    niceStep(
      xmax - xmin
    );

  const yStep =
    niceStep(
      ymax - ymin
    );

  ctx.fillStyle =
    "rgba(255,255,255,.68)";

  for (
    let x =
      Math.ceil(
        xmin / xStep
      ) * xStep;
    x <=
      xmax +
      xStep * .001;
    x += xStep
  ) {
    const xx = px(x);

    if (
      xx < 0 ||
      xx > cols
    ) continue;

    ctx.beginPath();

    ctx.moveTo(
      xx + .5,
      rows - 8
    );

    ctx.lineTo(
      xx + .5,
      rows
    );

    ctx.stroke();

    ctx.fillText(
      formatTick(x),
      xx + 4,
      rows - 10
    );
  }

  for (
    let y =
      Math.ceil(
        ymin / yStep
      ) * yStep;
    y <=
      ymax +
      yStep * .001;
    y += yStep
  ) {
    const yy = py(y);

    if (
      yy < 0 ||
      yy > rows
    ) continue;

    ctx.beginPath();

    ctx.moveTo(
      0,
      yy + .5
    );

    ctx.lineTo(
      8,
      yy + .5
    );

    ctx.stroke();

    ctx.fillText(
      formatTick(y),
      10,
      yy - 4
    );
  }

  ctx.restore();
}

function formatTick(x) {
  if (Math.abs(x) >= 100) {
    return x.toFixed(0);
  }

  if (Math.abs(x) >= 10) {
    return x.toFixed(1);
  }

  return x
    .toFixed(2)
    .replace(/0+$/, "")
    .replace(/\.$/, "");
}

function renderParameterForm(
  values = DEFAULTS[state.family]
) {
  const root =
    document.getElementById(
      "parameters"
    );

  const grid =
    document.createElement(
      "div"
    );

  grid.className =
    "parameter-bar";

  for (
    const field of parameterFields()
  ) {
    const wrap =
      document.createElement(
        "div"
      );

    wrap.className =
      "field" +
      (
        field.full
          ? " expression-field"
          : " compact-field"
      );

    const label =
      document.createElement(
        "label"
      );

    label.textContent =
      field.label;

    label.htmlFor =
      "param-" +
      field.key;

    const input =
      document.createElement(
        "input"
      );

    input.id =
      "param-" +
      field.key;

    input.dataset.key =
      field.key;

    input.value =
      values[field.key] ?? "";

    input.spellcheck = false;
    input.autocomplete = "off";

    wrap.append(
      label,
      input
    );

    grid.appendChild(
      wrap
    );
  }

  root.replaceChildren(grid);

  root
    .querySelectorAll("input")
    .forEach(input => {
      input.addEventListener(
        "change",
        scheduleParameterRender
      );

      input.addEventListener(
        "keydown",
        e => {
          if (e.key === "Enter") {
            scheduleParameterRender();
          }
        }
      );
    });
}

function readParams() {
  const result = {};

  document
    .querySelectorAll(
      "#parameters input"
    )
    .forEach(input => {
      result[
        input.dataset.key
      ] = input.value;
    });

  return result;
}

function setParams(values) {
  renderParameterForm(values);
}

function renderExamples() {
  const root =
    document.getElementById(
      "examples"
    );

  root.replaceChildren();

  for (
    const preset of
    PRESETS[state.family]
  ) {
    const btn =
      document.createElement(
        "button"
      );

    btn.textContent =
      preset.name;

    btn.addEventListener(
      "click",
      () => {
        setParams(
          preset.values
        );

        scheduleParameterRender();
      }
    );

    root.appendChild(btn);
  }
}

function activateFamily(family) {
  state.family = family;

  document
    .querySelectorAll(
      "#familyButtons button"
    )
    .forEach(btn => {
      btn.classList.toggle(
        "active",
        btn.dataset.family === family
      );
    });

  renderParameterForm(
    DEFAULTS[family]
  );

  renderExamples();
  scheduleParameterRender();
}


function updateStageLayout() {
  const stage =
    document.querySelector(
      ".stage"
    );

  if (!stage) return 1;

  return Math.max(1, stage.clientHeight);
}

function fitCanvasToStage() {
  const canvas =
    document.getElementById(
      "canvas"
    );

  const wrap =
    document.querySelector(
      ".canvas-wrap"
    );

  if (!canvas || !wrap || !canvas.width || !canvas.height) return;

  const availableWidth =
    Math.max(1, wrap.clientWidth);

  const availableHeight =
    Math.max(1, wrap.clientHeight);

  // Scale the displayed axes independently. The fractal is calculated at
  // full viewport resolution, while the display is allowed to change aspect
  // ratio so that neither edge is ever cropped.
  const displayWidth =
    Math.min(canvas.width, availableWidth);

  const displayHeight =
    Math.min(canvas.height, availableHeight);

  canvas.style.width =
    `${Math.max(1, Math.floor(displayWidth))}px`;

  canvas.style.height =
    `${Math.max(1, Math.floor(displayHeight))}px`;

  positionPlotOverlay();
}

function positionPlotOverlay() {
  const canvas =
    document.getElementById(
      "canvas"
    );

  const overlay =
    document.getElementById(
      "plotOverlay"
    );

  const stage =
    document.querySelector(
      ".stage"
    );

  if (!canvas || !overlay || !stage) return;

  const canvasRect =
    canvas.getBoundingClientRect();

  const stageRect =
    stage.getBoundingClientRect();

  overlay.style.left =
    `${canvasRect.left - stageRect.left}px`;

  overlay.style.top =
    `${canvasRect.top - stageRect.top}px`;

  overlay.style.width =
    `${canvasRect.width}px`;

  overlay.style.height =
    `${canvasRect.height}px`;
}

function drawExportWatermark(
  ctx,
  width,
  height
) {
  // Keep the exported watermark visually close to the on-screen watermark,
  // while scaling its padding/font for the actual PNG pixel dimensions.
  const canvas =
    document.getElementById(
      "canvas"
    );

  const rect =
    canvas
      ? canvas.getBoundingClientRect()
      : null;

  const scaleX =
    rect && rect.width
      ? width / rect.width
      : 1;

  const scaleY =
    rect && rect.height
      ? height / rect.height
      : 1;

  const scale =
    Math.max(
      1,
      Math.min(scaleX, scaleY)
    );

  const pad =
    Math.round(14 * scale);

  const textSize =
    Math.max(
      10,
      Math.round(10 * scale)
    );

  ctx.save();

  ctx.textAlign = "right";
  ctx.textBaseline = "bottom";
  ctx.fillStyle =
    "#9da5b3";
  ctx.font =
    `${textSize}px system-ui, sans-serif`;

  ctx.fillText(
    "digyt.github.io/fractal_explorer",
    width - pad,
    height - pad - Math.round(13 * scaleY)
  );

  ctx.restore();
}

function savePlotAsPng() {
  const canvas =
    document.getElementById(
      "canvas"
    );

  if (
    !canvas ||
    !canvas.width ||
    !canvas.height
  ) {
    return;
  }

  const exportCanvas =
    document.createElement(
      "canvas"
    );

  exportCanvas.width =
    canvas.width;

  exportCanvas.height =
    canvas.height;

  const ctx =
    exportCanvas.getContext(
      "2d",
      { alpha: false }
    );

  // The source canvas already contains the fractal and, when enabled,
  // the current axis/grid overlay. The live UI (status, coordinates,
  // progress bar, save button) is outside the canvas and is therefore
  // not copied into the PNG.
  ctx.drawImage(
    canvas,
    0,
    0
  );

  drawExportWatermark(
    ctx,
    exportCanvas.width,
    exportCanvas.height
  );

  exportCanvas.toBlob(
    blob => {
      if (!blob) return;

      const url =
        URL.createObjectURL(
          blob
        );

      const link =
        document.createElement(
          "a"
        );

      link.href = url;
      link.download =
        "fractal.png";

      document.body.appendChild(
        link
      );

      link.click();
      link.remove();

      setTimeout(
        () => URL.revokeObjectURL(url),
        1000
      );
    },
    "image/png"
  );
}

function updateResolution() {
  const dpr =
    Math.max(
      1,
      window.devicePixelRatio || 1
    );

  // Treat a browser window that fills the physical screen as fullscreen too.
  // This covers maximized browser windows (browser chrome still visible), not
  // only the page-level Fullscreen API. Otherwise keep the existing
  // browser-window/viewport sizing behavior.
  const screenWidth =
    Number(window.screen && window.screen.width) || 0;
  const screenHeight =
    Number(window.screen && window.screen.height) || 0;
  const outerWidth =
    Number(window.outerWidth) || 0;
  const outerHeight =
    Number(window.outerHeight) || 0;

  const availableWidth =
    Number(window.screen && window.screen.availWidth) || screenWidth;
  const availableHeight =
    Number(window.screen && window.screen.availHeight) || screenHeight;
  const tolerance = 40;

  // A maximized browser window normally has outer dimensions that match the
  // OS-available screen area (or the full screen, depending on the platform).
  // The tolerance absorbs window borders/title-bar rounding differences.
  const browserWindowFillsScreen =
    screenWidth > 0 &&
    screenHeight > 0 &&
    (
      (Math.abs(outerWidth - availableWidth) <= tolerance &&
       Math.abs(outerHeight - availableHeight) <= tolerance) ||
      (Math.abs(outerWidth - screenWidth) <= tolerance &&
       Math.abs(outerHeight - screenHeight) <= tolerance)
    );

  const isFullscreen =
    Boolean(document.fullscreenElement) ||
    browserWindowFillsScreen;

  const cssWidth = isFullscreen
    ? screenWidth
    : window.innerWidth;
  const cssHeight = isFullscreen
    ? screenHeight
    : window.innerHeight;

  state.resX =
    Math.max(
      1,
      Math.floor(cssWidth * dpr)
    );

  state.resY =
    Math.max(
      1,
      Math.floor(cssHeight * dpr)
    );
}

function toNumber(
  s,
  fallback
) {
  const n = Number(s);

  return Number.isFinite(n)
    ? n
    : fallback;
}

function parseRealOrComplexLiteral(
  text
) {
  const s =
    String(text)
      .trim()
      .replace(/\s+/g, "");

  if (s.endsWith("i")) {
    const body =
      s.slice(0, -1);

    const m =
      body.match(
        /^([+-]?(?:\d+(?:\.\d*)?|\.\d+)?)([+-](?:\d+(?:\.\d*)?|\.\d+)?)$/
      );

    if (m) {
      return complex(
        Number(m[1] || 0),
        Number(m[2])
      );
    }

    if (
      body === "" ||
      body === "+"
    ) {
      return complex(0, 1);
    }

    if (body === "-") {
      return complex(0, -1);
    }

    const imag =
      Number(body);

    if (Number.isFinite(imag)) {
      return complex(0, imag);
    }
  }

  const n = Number(s);

  if (Number.isFinite(n)) {
    return complex(n, 0);
  }

  throw new Error(
    `Invalid complex value: ${text}`
  );
}

function makeMandelbrotFunction(
  formula
) {
  const fn =
    compileComplexExpression(
      formula,
      ["z", "c"]
    );

  const out =
    (z, c) =>
      asComplex(fn(z, c));

  const normalized =
    String(formula)
      .replace(/\s+/g, "")
      .replace(/\^/g, "**")
      .toLowerCase();

  if (
    normalized ===
    "z**2+c"
  ) {
    attachMandelbrotKernel(
      out,
      "z2+c"
    );
  } else if (
    normalized ===
    "z**4+c"
  ) {
    attachMandelbrotKernel(
      out,
      "z4+c"
    );
  } else if (
    normalized ===
      "conj(z)**2+c" ||
    normalized ===
      "conj(z)^2+c"
  ) {
    attachMandelbrotKernel(
      out,
      "conjz2+c"
    );
  }

  return out;
}

function makeNewtonFunction(
  formula
) {
  const fn =
    compileComplexExpression(
      formula,
      ["z"]
    );

  return z =>
    asComplex(fn(z));
}

const FRACTAL_WORKER_URL = URL.createObjectURL(
  new Blob([FRACTAL_WORKER_SOURCE], { type: "application/javascript" })
);

function createFractalWorker() {
  return new Worker(FRACTAL_WORKER_URL);
}

function stopActiveRender() {
  if (fractalWorker) {
    fractalWorker.terminate();
    fractalWorker = null;
  }
  state.rendering = false;
}

function renderFractal() {
  const myToken = ++state.renderToken;

  stopActiveRender();
  fractalWorker = createFractalWorker();
  state.rendering = true;

  const status = document.getElementById("statusText");
  const bar = document.getElementById("progressBar");

  status.textContent = "Rendering…";
  bar.style.width = "3%";

  try {
    updateStageLayout();
    updateResolution();

    const p = readParams();
    const worker = fractalWorker;

    worker.onmessage = event => {
      if (myToken !== state.renderToken || worker !== fractalWorker) return;

      const message = event.data || {};

      if (message.type === "progress") {
        bar.style.width = `${3 + Math.round(message.progress * 89)}%`;
        return;
      }

      if (message.type === "error") {
        console.error(message.message);
        status.textContent = "Error: " + message.message;
        bar.style.width = "0%";
        worker.terminate();
        if (fractalWorker === worker) fractalWorker = null;
        state.rendering = false;
        return;
      }

      if (message.type !== "complete") return;

      state.cachedMap = message.map;
      state.cachedXSpace = {
        re: message.x_space.re,
        im: message.x_space.im,
        rows: message.x_space.rows,
        cols: message.x_space.cols,
        xMin: message.x_space.xMin,
        xMax: message.x_space.xMax,
        yMin: message.x_space.yMin,
        yMax: message.x_space.yMax
      };
      state.lastXSpace = state.cachedXSpace;

      bar.style.width = "92%";
      repaintCachedMap();
      bar.style.width = "100%";
      status.textContent = `Rendered ${state.resX} × ${state.resY}`;

      worker.terminate();
      if (fractalWorker === worker) fractalWorker = null;
      state.rendering = false;

      setTimeout(() => {
        if (!state.rendering && myToken === state.renderToken) {
          bar.style.width = "0%";
        }
      }, 400);
    };

    worker.onerror = error => {
      if (myToken !== state.renderToken || worker !== fractalWorker) return;
      console.error(error);
      status.textContent = "Error: " + (error.message || "Worker error");
      bar.style.width = "0%";
      worker.terminate();
      if (fractalWorker === worker) fractalWorker = null;
      state.rendering = false;
    };

    worker.postMessage({
      family: state.family,
      resX: state.resX,
      resY: state.resY,
      params: p
    });
  } catch (error) {
    console.error(error);
    status.textContent = "Error: " + error.message;
    bar.style.width = "0%";
    if (fractalWorker) {
      fractalWorker.terminate();
      fractalWorker = null;
    }
    state.rendering = false;
  }
}

function repaintCachedMap() {
  if (
    !state.cachedMap ||
    !state.cachedXSpace
  ) {
    return;
  }

  plot_fractal_map(
    state.cachedMap,
    state.cachedXSpace,
    document.getElementById(
      "colormap"
    ).value,
    document.getElementById(
      "showAxis"
    ).checked
  );
}

function scheduleParameterRender() {
  clearTimeout(renderTimer);

  // Stop an in-flight calculation immediately. The existing 30 ms debounce
  // is kept unchanged before starting the replacement calculation.
  if (fractalWorker) {
    fractalWorker.terminate();
    fractalWorker = null;
    state.renderToken++;
    state.rendering = false;
  }

  renderTimer = setTimeout(renderFractal, 30);
}

/* ============================================================
   Init
   ============================================================ */

document
  .querySelectorAll(
    "#familyButtons button"
  )
  .forEach(btn => {
    btn.addEventListener(
      "click",
      () =>
        activateFamily(
          btn.dataset.family
        )
    );
  });

document
  .getElementById(
    "showAxis"
  )
  .addEventListener(
    "change",
    repaintCachedMap
  );

document
  .getElementById(
    "colormap"
  )
  .addEventListener(
    "change",
    repaintCachedMap
  );

document
  .getElementById(
    "savePng"
  )
  .addEventListener(
    "click",
    savePlotAsPng
  );

document.addEventListener("fullscreenchange", () => {
  updateStageLayout();
  updateResolution();
  positionPlotOverlay();
  scheduleParameterRender();
});

window.addEventListener(
  "resize",
  () => {
    updateStageLayout();
    updateResolution();
    positionPlotOverlay();

    // The calculation resolution follows the viewport, so resize the
    // fractal as well. The existing debounce stops resize events from
    // launching a render for every intermediate browser size.
    scheduleParameterRender();
  }
);

const canvas =
  document.getElementById(
    "canvas"
  );

const updatePointerCoords = e => {
  if (!state.lastXSpace) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const u =
    (e.clientX - rect.left) /
    rect.width;

  const v =
    (e.clientY - rect.top) /
    rect.height;

  const xs =
    state.lastXSpace;

  const re =
    xs.xMin +
    u *
      (xs.xMax -
        xs.xMin);

  const im =
    xs.yMax -
    v *
      (xs.yMax -
        xs.yMin);

  document
    .getElementById(
      "coordsText"
    )
    .textContent =
    `Re ${re.toFixed(5)}  Im ${im.toFixed(5)}`;
};

canvas.addEventListener(
  "pointermove",
  updatePointerCoords
);

updateStageLayout();
activateFamily(
  "mandelbrot"
);

// Preserve the last x_space for coordinate display by wrapping plot call state.
const _plot =
  plot_fractal_map;

plot_fractal_map =
  function(
    fractal_map,
    x_space = null,
    cmap = "magma",
    show_axis = false
  ) {
    state.lastXSpace =
      x_space;

    const result =
      _plot(
        fractal_map,
        x_space,
        cmap,
        show_axis
      );

    positionPlotOverlay();

    return result;
  };

window.addEventListener("beforeunload", () => {
  if (fractalWorker) fractalWorker.terminate();
  URL.revokeObjectURL(FRACTAL_WORKER_URL);
});
</script>
